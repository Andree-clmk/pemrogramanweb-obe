<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portal inventaris laboratorium dan proyek individu">
    <title>WebLab - Inventaris Laboratorium</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a href="#main">Lewati ke konten utama</a>
        <h1>WebLab - Inventaris Laboratorium</h1>
        <nav aria-label="Navigasi Utama">
            <ul>
                <li><a href="#layanan">Layanan</a></li>
                <li><a href="#tentang">Tentang</a></li>
                <li><a href="#kontak">Kontak</a></li>
            </ul>
        </nav>
    </header>
    
    <main id="main">
        <!-- Section 1: Layanan -->
        <section id="layanan">
            <h2>Layanan Inventaris</h2>
            <img src="images/banner-dekorasi.png" alt="">
        </section>

        <!-- Section 2: Tentang & Daftar Inventaris Dinamis -->
        <section id="tentang">
            <h2>Tentang Sistem</h2>
            <article>
                <h3>Pencatatan Peralatan</h3>
                <img src="images/alat-ukur.jpg" alt="Perangkat mikrokontroler dan alat ukur digital di meja laboratorium">
                <p>Mencatat data alat dan status kondisi secara berkala.</p>
            </article>

            <!-- Bagian Kontrol (Pencarian, Limit Halaman, Filter, & Tema) -->
            <div class="control-section" style="margin-top: 2rem;">
                <h3>Pencarian & Filter Inventaris Alat</h3>
                
                <!-- Kotak Pencarian Berdasarkan Nama (Latihan 1) -->
                <div class="search-container" style="margin-top: 1rem; margin-bottom: 1rem;">
                    <input type="text" id="cari-nama" placeholder="Cari nama alat..." class="form-control" style="width: 100%; padding: 0.5rem;">
                </div>

                <!-- Pilihan Jumlah Item per Halaman (Latihan 3) -->
                <div class="limit-container" style="margin-top: 1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                    <label for="limit-select">Tampilkan per halaman:</label>
                    <select id="limit-select" class="form-control" style="padding: 0.4rem;">
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                    </select>
                </div>

                <!-- Tombol Filter & Tema -->
                <div class="filter-container" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button data-filter="Semua" class="btn">Semua</button>
                    <button data-filter="Baik" class="btn">Baik</button>
                    <button data-filter="Perlu Cek" class="btn">Perlu Cek</button>
                    <button id="theme-button" type="button" class="btn">Ganti Tema</button>
                </div>
            </div>

            <!-- WADAH UTAMA TEMPAT ITEM INVENTARIS DIRENDER SECARA DINAMIS -->
            <section id="daftar-alat" style="margin-top: 1.5rem;">
                <!-- Item inventaris akan dimuat secara otomatis oleh JavaScript -->
            </section>
        </section>

        <!-- Section 3: Form Pendataan Alat dengan Validasi (Langkah Praktikum) -->
        <section id="kontak" style="margin-top: 2rem;">
            <h2>Form Pendataan Alat</h2>
            <p id="form-status" style="font-weight: bold;"></p>
            
            <form id="form-alat" novalidate>
                <!-- Nama Alat (Tipe Teks) -->
                <div style="margin-bottom: 1rem;">
                    <label for="nama">Nama Alat</label>
                    <input type="text" id="nama" name="nama" required class="form-control" style="width: 100%; padding: 0.4rem;">
                    <span id="error-nama" class="error" style="color: red; font-size: 0.85rem;"></span>
                </div>

                <!-- Kategori (Tipe Teks) -->
                <div style="margin-bottom: 1rem;">
                    <label for="kategori">Kategori</label>
                    <input type="text" id="kategori" name="kategori" required class="form-control" style="width: 100%; padding: 0.4rem;">
                    <span id="error-kategori" class="error" style="color: red; font-size: 0.85rem;"></span>
                </div>

                <!-- Jumlah (Tipe Number dengan min dan required) -->
                <div style="margin-bottom: 1rem;">
                    <label for="jumlah">Jumlah</label>
                    <input type="number" id="jumlah" name="jumlah" min="0" required class="form-control" style="width: 100%; padding: 0.4rem;">
                    <span id="error-jumlah" class="error" style="color: red; font-size: 0.85rem;"></span>
                </div>

                <!-- Kondisi (Opsi Pilihan) -->
                <div style="margin-bottom: 1rem;">
                    <label for="kondisi">Kondisi</label>
                    <select id="kondisi" name="kondisi" required class="form-control" style="width: 100%; padding: 0.4rem;">
                        <option value="">Pilih Kondisi</option>
                        <option value="Baik">Baik</option>
                        <option value="Perlu Cek">Perlu Cek</option>
                    </select>
                    <span id="error-kondisi" class="error" style="color: red; font-size: 0.85rem;"></span>
                </div>

                <!-- Tanggal Perolehan (Tipe Date dengan required) -->
                <div style="margin-bottom: 1rem;">
                    <label for="tanggal">Tanggal Perolehan</label>
                    <input type="date" id="tanggal" name="tanggal" required class="form-control" style="width: 100%; padding: 0.4rem;">
                    <span id="error-tanggal" class="error" style="color: red; font-size: 0.85rem;"></span>
                </div>

                <button type="submit" class="btn">Simpan Data</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 WebLab</p>
    </footer>
    
    <!-- Skrip JavaScript Modular -->
    <script type="module" src="js/app.js"></script>
</body>
</html>

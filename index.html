<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portal inventaris laboratorium dan proyek individu">
    <title>WebLab - Inventaris Laboratorium</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a href="#main">Lewati ke konten utama</a>
        <h1>WebLab - Inventaris Laboratorium</h1>
        <nav aria-label="Navigasi Utama">
            <ul>
                <li><a href="#layanan">Layanan</a></li>
                <li><a href="#tentang">Tentang</a></li>
                <li><a href="#kontak">Kontak</a></li>
            </ul>
        </nav>
    </header>
    
    <main id="main">
        <!-- Section 1: Layanan -->
        <section id="layanan">
            <h2>Layanan Inventaris</h2>
            <img src="images/banner-dekorasi.png" alt="">
        </section>

        <!-- Section 2: Tentang & Daftar Inventaris Dinamis -->
        <section id="tentang">
            <h2>Tentang Sistem</h2>
            <article>
                <h3>Pencatatan Peralatan</h3>
                <img src="images/alat-ukur.jpg" alt="Perangkat mikrokontroler dan alat ukur digital di meja laboratorium">
                <p>Mencatat data alat dan status kondisi secara berkala.</p>
            </article>

            <!-- Bagian Tombol Filter & Tema Sesuai Modul Praktikum -->
            <div class="control-section" style="margin-top: 2rem;">
                <h3>Filter Inventaris Alat</h3>
                <div class="filter-container" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem;">
                    <button data-filter="Semua" class="btn">Semua</button>
                    <button data-filter="Baik" class="btn">Baik</button>
                    <button data-filter="Perlu Cek" class="btn">Perlu Cek</button>
                    <button id="theme-button" type="button" class="btn">Ganti Tema</button>
                </div>
            </div>

            <!-- WADAH UTAMA TEMPAT ITEM INVENTARIS DIRENDER SECARA DINAMIS -->
            <section id="daftar-alat" style="margin-top: 1.5rem;">
                <!-- Item inventaris akan dimuat secara otomatis oleh JavaScript -->
            </section>
        </section>

        <!-- Section 3: Kontak (Memuat Form) -->
        <section id="kontak">
            <h2>Formulir Kontak</h2>
            <form>
                <label for="nama">Nama Lengkap</label>
                <input id="nama" name="nama" type="text" required>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
                
                <button type="submit">Kirim</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 WebLab</p>
    </footer>
    
    <!-- Skrip JavaScript Modular -->
    <script type="module" src="js/app.js"></script>
</body>
</html>

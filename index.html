<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portal inventaris laboratorium Teknik Komputer">
    <title>WebLab - Inventaris Laboratorium</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a href="#main">Lewati ke konten utama</a>
        <h1>WebLab</h1>
        <nav aria-label="Navigasi utama">
            <a href="#layanan">Layanan</a>
            <a href="#kontak">Kontak</a>
        </nav>
    </header>
    
    <main id="main">
        <section id="layanan">
            <h2>Layanan Inventaris</h2>
            
            <!-- Contoh 1: Gambar dekoratif murni (menggunakan alt="") -->
            <img src="images/banner-dekorasi.png" alt="">

            <article>
                <h3>Pencatatan Peralatan</h3>
                
                <!-- Contoh 2: Gambar konten/ilustrasi bermakna (menggunakan alt deskriptif) -->
                <img src="images/alat-ukur.jpg" alt="Perangkat mikrokontroler dan alat ukur digital di meja laboratorium">
                
                <p>Mencatat data alat dan status kondisi.</p>
            </article>
        </section>

        <section id="kontak">
            <h2>Kontak</h2>
            <form>
                <!-- Penambahan input Nama Lengkap dengan label yang terikat secara tepat -->
                <label for="nama">Nama Lengkap</label>
                <input id="nama" name="nama" type="text" required>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
                
                <button type="submit">Kirim</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 WebLab</p>
    </footer>
    <script type="module" src="js/app.js"></script>
</body>
</html>
